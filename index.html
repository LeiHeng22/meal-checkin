<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>每日打卡</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="sheet">
    <p class="eyebrow">宿舍厨房 · 晚间一票</p>
    <div class="nav">
      <button type="button" class="nav-btn" id="prev">前一天</button>
      <div class="date-block">
        <p id="date-label">今天</p>
        <button type="button" class="text-btn" id="today-btn">回到今天</button>
      </div>
      <button type="button" class="nav-btn" id="next">后一天</button>
    </div>
    <p id="sync" class="sync"></p>
    <article class="ticket">
      <div class="week" id="week"></div>
      <div class="hero" id="hero"></div>
      <div id="sections"></div>
      <div class="extra" id="extra"></div>
    </article>
    <div class="foot">
      <button type="button" class="ghost" id="open-settings">连接 GitHub</button>
      <a href="https://github.com/LeiHeng22/meal-checkin/commits/main/data/checkins.json">提交记录</a>
    </div>
  </main>

  <dialog id="settings">
    <h2>连接 GitHub</h2>
    <p>手机和电脑各保存一次令牌。令牌只留在这台设备的浏览器里，不会写进仓库。</p>
    <ol>
      <li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">新建细粒度令牌</a>。</li>
      <li>仓库权限只选 <strong>LeiHeng22/meal-checkin</strong>。</li>
      <li>Contents 选读写，生成后把令牌粘贴到下面。手机上如果不好建细粒度令牌，用<a href="https://github.com/settings/tokens/new?scopes=repo&description=meal-checkin" target="_blank" rel="noopener">经典令牌</a>，只勾 repo。</li>
    </ol>
    <input class="token" id="token" type="password" autocomplete="off" placeholder="github_pat_...">
    <div class="dialog-actions">
      <button type="button" class="primary" id="save-token">保存令牌</button>
      <button type="button" class="ghost" id="forget-token">清除令牌</button>
      <button type="button" class="ghost" id="close-settings">关闭</button>
    </div>
    <p class="warn" id="settings-msg"></p>
    <p class="warn">这个仓库是公开的。勾选、体重和备注写上去之后，别人能在 GitHub 上看到。备注不要写密码。</p>
  </dialog>

  <script src="js/plan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
